<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#111827"
>

<link
  rel="manifest"
  href="manifest.json"
>

<title>Metal Weight</title>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.wrap{
  max-width:620px;
  margin:auto;
  padding:20px 16px 36px;
}

.top{
  margin-bottom:18px;
}

h1{
  font-size:24px;
  margin:0;
  font-weight:750;
}

.sub{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 3px 14px #0000000b;
}

label{
  display:block;
  font-size:14px;
  color:#6b7280;
  margin:0 0 7px;
}

.shape-row{
  margin-bottom:18px;
}

.row,
.quantity-row{
  display:grid;
  grid-template-columns:minmax(110px,0.75fr) minmax(165px,1.25fr);
  gap:10px;
  margin-bottom:14px;
}

input,
select,
button{
  width:100%;
  height:50px;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:0 13px;
  font-size:16px;
  background:white;
}

input{
  font-size:18px;
  font-weight:500;
}

select{
  font-size:15px;
}

input:focus,
select:focus{
  outline:2px solid #9ca3af;
  outline-offset:1px;
}

.qty-label{
  display:flex;
  align-items:center;
  padding:0 13px;
  height:50px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#f9fafb;
  color:#6b7280;
  font-size:15px;
}

.extra-info{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px 14px;
  margin-top:5px;
  font-size:14px;
  line-height:1.6;
}

.extra-info strong{
  color:#111827;
}

.result{
  background:#111827;
  color:white;
  border-radius:18px;
  padding:22px 18px;
  margin-top:14px;
}

.result-item{
  text-align:center;
}

.result-divider{
  height:1px;
  background:#374151;
  margin:18px 0;
}

.result-title{
  font-size:13px;
  color:#9ca3af;
  margin-bottom:6px;
}

.result .num{
  font-size:38px;
  font-weight:800;
  line-height:1.1;
  word-break:break-word;
}

.total .num{
  font-size:44px;
}

.result .unit{
  font-size:15px;
  color:#d1d5db;
  margin-top:7px;
}

.action-area{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

button{
  cursor:pointer;
  font-weight:700;
}

.save-btn{
  background:#111827;
  color:white;
  border-color:#111827;
}

.reset-btn{
  background:white;
  color:#111827;
}

.history-card{
  margin-top:14px;
}

.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.history-title{
  font-size:18px;
  font-weight:750;
}

.clear-history{
  width:auto;
  height:38px;
  padding:0 12px;
  font-size:13px;
  color:#991b1b;
  background:#fff;
}

.empty-history{
  color:#9ca3af;
  text-align:center;
  font-size:14px;
  padding:18px 5px;
}

.history-item{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:13px;
  margin-top:10px;
  background:#f9fafb;
}

.history-main{
  cursor:pointer;
}

.history-shape{
  font-size:12px;
  color:#6b7280;
  margin-bottom:5px;
}

.history-dimensions{
  font-size:15px;
  font-weight:700;
  line-height:1.5;
}

.history-info{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
  line-height:1.5;
}

.history-weight{
  margin-top:8px;
  font-size:14px;
}

.history-weight strong{
  color:#111827;
}

.history-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.history-time{
  font-size:11px;
  color:#9ca3af;
}

.delete-btn{
  width:auto;
  height:34px;
  padding:0 11px;
  font-size:12px;
  background:#fff;
  color:#991b1b;
}

.saved-message{
  display:none;
  text-align:center;
  color:#047857;
  font-size:13px;
  font-weight:600;
  margin-top:9px;
}

.note{
  font-size:12px;
  color:#6b7280;
  line-height:1.6;
  text-align:center;

}

.install{
  display:none;
  margin-bottom:12px;
}

.install button{
  background:#fff;
}

.hidden{
  display:none;
}


@media(max-width:420px){

  .wrap{
    padding:16px 12px 28px;
  }

  .card{
    padding:15px;
  }

  .row,
  .quantity-row{
    grid-template-columns:minmax(95px,0.7fr) minmax(155px,1.3fr);
    gap:8px;
  }

  input,
  select,
  button,
  .qty-label{
    height:48px;
  }

  select{
    font-size:14px;
    padding-left:10px;
    padding-right:8px;
  }

  .result .num{
    font-size:34px;
  }

  .total .num{
    font-size:40px;
  }

}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.menu-btn{
  width:48px;
  min-width:48px;
  height:48px;
  padding:0;
  font-size:25px;
  line-height:1;
  background:white;
  color:#111827;
  border:1px solid #d1d5db;
}

.drawer-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  opacity:0;
  visibility:hidden;
  transition:0.25s;
  z-index:998;
}

.drawer-overlay.open{
  opacity:1;
  visibility:visible;
}

.drawer{
  position:fixed;
  top:0;
  right:-290px;
  width:280px;
  max-width:85vw;
  height:100vh;
  background:white;

  z-index:999;
  transition:right 0.25s ease;

}

.drawer.open{
  right:0;
}

.drawer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.drawer-title{
  font-size:20px;
  font-weight:750;
}

.drawer-close{
  width:42px;
  height:42px;
  padding:0;
  font-size:28px;
  background:white;
}

.drawer-item{
  text-align:left;
  margin-bottom:10px;
  background:#f9fafb;
  color:#111827;
}
</style>

</head>


<body>

<div class="wrap">


<div class="top topbar">

  <div>
    <h1>Metal Weight</h1>

    <div class="sub">
      Metal Weight Calculator · 金属重量计算器
    </div>
  </div>

  <button
    id="menuBtn"
    class="menu-btn"
    type="button"
  >
    ☰
  </button>

</div>


  <div
    class="card install"
    id="installBox"
  >

    <button id="installBtn">
      + Install App 安装到手机
    </button>

  </div>


  <div class="card">


    <label>
      Shape 类型
    </label>

    <div class="shape-row">

      <select id="shape">

        <option value="plate">
          Plate 板材
        </option>

        <option value="roundTube">
          Hollow Round Tube 空心圆管
        </option>

      </select>

    </div>



    <!-- PLATE -->

    <div id="plateFields">


      <label>
        Length 长度
      </label>

      <div class="row">

        <input
          id="plateL"
          type="number"
          inputmode="decimal"
          value="1"
          step="any"
        >

        <select id="plateLu">

          <option value="m">
            Meter (m)
          </option>

          <option value="cm">
            Centimeter (cm)
          </option>

          <option value="mm">
            Millimeter (mm)
          </option>

          <option value="ft">
            Feet (ft)
          </option>

          <option value="in">
            Inch (in)
          </option>

        </select>

      </div>


      <label>
        Width 宽度
      </label>

      <div class="row">

        <input
          id="plateW"
          type="number"
          inputmode="decimal"
          value="1"
          step="any"
        >

        <select id="plateWu">

          <option value="m">
            Meter (m)
          </option>

          <option value="cm">
            Centimeter (cm)
          </option>

          <option value="mm">
            Millimeter (mm)
          </option>

          <option value="ft">
            Feet (ft)
          </option>

          <option value="in">
            Inch (in)
          </option>

        </select>

      </div>


      <label>
        Thickness 厚度
      </label>

      <div class="row">

        <input
          id="plateT"
          type="number"
          inputmode="decimal"
          value="1"
          step="any"
        >

        <select id="plateTu">

          <option
            value="mm"
            selected
          >
            Millimeter (mm)
          </option>

          <option value="cm">
            Centimeter (cm)
          </option>

          <option value="m">
            Meter (m)
          </option>

          <option value="ft">
            Feet (ft)
          </option>

          <option value="in">
            Inch (in)
          </option>

        </select>

      </div>


    </div>



    <!-- HOLLOW ROUND TUBE -->

    <div
      id="tubeFields"
      class="hidden"
    >


      <label>
        Outer Diameter 外径
      </label>

      <div class="row">

        <input
          id="tubeOD"
          type="number"
          inputmode="decimal"
          value="800"
          step="any"
        >

        <select id="tubeODu">

          <option value="mm" selected>
            Millimeter (mm)
          </option>

          <option value="cm">
            Centimeter (cm)
          </option>

          <option value="m">
            Meter (m)
          </option>

          <option value="ft">
            Feet (ft)
          </option>

          <option value="in">
            Inch (in)
          </option>

        </select>

      </div>


      <label>
        Length 长度
      </label>

      <div class="row">

        <input
          id="tubeL"
          type="number"
          inputmode="decimal"
          value="1200"
          step="any"
        >

        <select id="tubeLu">

          <option value="mm" selected>
            Millimeter (mm)
          </option>

          <option value="cm">
            Centimeter (cm)
          </option>

          <option value="m">
            Meter (m)
          </option>

          <option value="ft">
            Feet (ft)
          </option>

          <option value="in">
            Inch (in)
          </option>

        </select>

      </div>


      <label>
        Thickness 厚度
      </label>

      <div class="row">

        <input
          id="tubeT"
          type="number"
          inputmode="decimal"
          value="5"
          step="any"
        >

        <select id="tubeTu">

          <option value="mm" selected>
            Millimeter (mm)
          </option>

          <option value="cm">
            Centimeter (cm)
          </option>

          <option value="m">
            Meter (m)
          </option>

          <option value="ft">
            Feet (ft)
          </option>

          <option value="in">
            Inch (in)
          </option>

        </select>

      </div>


      <div class="extra-info">

        Inner Diameter 内径:

        <strong id="innerDiameter">
          790.000 mm
        </strong>

      </div>


    </div>



    <br>


    <label>
      Quantity 数量
    </label>

    <div class="quantity-row">

      <input
        id="Q"
        type="number"
        inputmode="numeric"
        value="1"
        min="1"
        step="1"
      >

      <div class="qty-label">
        Pieces (PCS) · 件
      </div>

    </div>


  </div>



  <div class="result">


    <div class="result-item">

      <div class="result-title">
        Single Weight 单件重量
      </div>

      <div
        class="num"
        id="singleKg"
      >
        7.850
      </div>

      <div class="unit">
        KG
      </div>

    </div>


    <div class="result-divider"></div>


    <div class="result-item total">

      <div class="result-title">
        Total Weight 总重量
      </div>

      <div
        class="num"
        id="totalKg"
      >
        7.850
      </div>

      <div class="unit">
        KG
      </div>

    </div>


  </div>



  <div class="action-area">

    <button
      class="save-btn"
      id="saveBtn"
      type="button"
    >
      Save Record 保存记录
    </button>

    <button
      class="reset-btn"
      id="resetBtn"
      type="button"
    >
      Reset 清除
    </button>

  </div>


  <div
    class="saved-message"
    id="savedMessage"
  >
    ✓ Record saved 已保存
  </div>



  <div class="card history-card">


    <div class="history-header">

      <div class="history-title">
        History 历史记录
      </div>

      <button
        class="clear-history"
        id="clearHistoryBtn"
        type="button"
      >
        Clear All 全部清除
      </button>

    </div>


    <div id="historyList"></div>


  </div>



  <div class="note">

    Steel density: 7,850 kg/m³

    <br>

    钢材密度：7,850 kg/m³

    <br>

    Calculated as solid steel material volume.

    <br>

    按实际钢材体积计算。

  </div>


</div>



<script>


const density = 7850;


const factor = {

  m:1,

  cm:0.01,

  mm:0.001,

  ft:0.3048,

  in:0.0254

};


const unitLabel = {

  m:'m',

  cm:'cm',

  mm:'mm',

  ft:'ft',

  in:'in'

};



const shape =
  document.getElementById('shape');


const plateFields =
  document.getElementById('plateFields');

const tubeFields =
  document.getElementById('tubeFields');



const plateL =
  document.getElementById('plateL');

const plateW =
  document.getElementById('plateW');

const plateT =
  document.getElementById('plateT');


const plateLu =
  document.getElementById('plateLu');

const plateWu =
  document.getElementById('plateWu');

const plateTu =
  document.getElementById('plateTu');



const tubeOD =
  document.getElementById('tubeOD');

const tubeL =
  document.getElementById('tubeL');

const tubeT =
  document.getElementById('tubeT');


const tubeODu =
  document.getElementById('tubeODu');

const tubeLu =
  document.getElementById('tubeLu');

const tubeTu =
  document.getElementById('tubeTu');


const innerDiameterBox =
  document.getElementById('innerDiameter');



const quantityInput =
  document.getElementById('Q');


const singleBox =
  document.getElementById('singleKg');

const totalBox =
  document.getElementById('totalKg');


const saveBtn =
  document.getElementById('saveBtn');

const resetBtn =
  document.getElementById('resetBtn');

const historyList =
  document.getElementById('historyList');

const clearHistoryBtn =
  document.getElementById('clearHistoryBtn');

const savedMessage =
  document.getElementById('savedMessage');



function formatWeight(kg){

  if(!isFinite(kg) || kg <= 0){

    return '0.000';

  }


  if(kg < 1){

    return kg.toLocaleString(
      'en-US',
      {
        minimumFractionDigits:3,
        maximumFractionDigits:6
      }
    );

  }


  return kg.toLocaleString(
    'en-US',
    {
      minimumFractionDigits:3,
      maximumFractionDigits:3
    }
  );

}



function changeShape(){

  if(shape.value === 'plate'){

    plateFields.classList.remove(
      'hidden'
    );

    tubeFields.classList.add(
      'hidden'
    );

  }

  else{

    plateFields.classList.add(
      'hidden'
    );

    tubeFields.classList.remove(
      'hidden'
    );

  }


  calculateWeight();

}



function calculatePlate(){

  const L =
    parseFloat(plateL.value) || 0;

  const W =
    parseFloat(plateW.value) || 0;

  const T =
    parseFloat(plateT.value) || 0;


  const lengthM =
    L * factor[plateLu.value];

  const widthM =
    W * factor[plateWu.value];

  const thicknessM =
    T * factor[plateTu.value];


  const volume =
    lengthM *
    widthM *
    thicknessM;


  const weight =
    volume * density;


  return {

    valid:
      L > 0 &&
      W > 0 &&
      T > 0,

    singleKg:weight,

    data:{

      L,
      W,
      T,

      Lu:plateLu.value,
      Wu:plateWu.value,
      Tu:plateTu.value

    }

  };

}



function calculateTube(){

  const OD =
    parseFloat(tubeOD.value) || 0;

  const L =
    parseFloat(tubeL.value) || 0;

  const T =
    parseFloat(tubeT.value) || 0;


  const outerDiameterM =
    OD * factor[tubeODu.value];

  const lengthM =
    L * factor[tubeLu.value];

  const thicknessM =
    T * factor[tubeTu.value];


  const innerDiameterM =
    outerDiameterM -
    (2 * thicknessM);


  if(
    outerDiameterM <= 0 ||
    lengthM <= 0 ||
    thicknessM <= 0 ||
    innerDiameterM <= 0
  ){

    innerDiameterBox.textContent =
      'Invalid 无效';

    return {

      valid:false,

      singleKg:0,

      data:{
        OD,
        L,
        T,
        ODu:tubeODu.value,
        Lu:tubeLu.value,
        Tu:tubeTu.value
      }

    };

  }


  const outerArea =
    Math.PI *
    outerDiameterM *
    outerDiameterM /
    4;


  const innerArea =
    Math.PI *
    innerDiameterM *
    innerDiameterM /
    4;


  const steelArea =
    outerArea -
    innerArea;


  const volume =
    steelArea *
    lengthM;


  const weight =
    volume *
    density;


  const innerDiameterMM =
    innerDiameterM *
    1000;


  innerDiameterBox.textContent =

    innerDiameterMM.toLocaleString(
      'en-US',
      {
        minimumFractionDigits:3,
        maximumFractionDigits:3
      }
    )

    +

    ' mm';


  return {

    valid:true,

    singleKg:weight,

    data:{

      OD,
      L,
      T,

      ODu:tubeODu.value,
      Lu:tubeLu.value,
      Tu:tubeTu.value,

      innerDiameterMM

    }

  };

}



function getCalculation(){

  let result;


  if(shape.value === 'plate'){

    result =
      calculatePlate();

  }

  else{

    result =
      calculateTube();

  }


  let Q =
    parseInt(
      quantityInput.value,
      10
    ) || 1;


  if(Q < 1){

    Q = 1;

  }


  result.Q =
    Q;


  result.totalKg =
    result.singleKg *
    Q;


  result.shape =
    shape.value;


  return result;

}



function calculateWeight(){

  const result =
    getCalculation();


  singleBox.textContent =
    formatWeight(
      result.singleKg
    );


  totalBox.textContent =
    formatWeight(
      result.totalKg
    );

}



function resetForm(){

  quantityInput.value =
    1;


  if(shape.value === 'plate'){

    plateL.value =
      1;

    plateW.value =
      1;

    plateT.value =
      1;


    plateLu.value =
      'm';

    plateWu.value =
      'm';

    plateTu.value =
      'mm';

  }


  else{

    tubeOD.value =
      800;

    tubeL.value =
      1200;

    tubeT.value =
      5;


    tubeODu.value =
      'mm';

    tubeLu.value =
      'mm';

    tubeTu.value =
      'mm';

  }


  calculateWeight();

}



function getHistory(){

  try{

    return JSON.parse(

      localStorage.getItem(
        'metalWeightHistory'
      )

    ) || [];

  }

  catch(e){

    return [];

  }

}



function saveHistory(history){

  localStorage.setItem(

    'metalWeightHistory',

    JSON.stringify(history)

  );

}



function saveRecord(){

  const result =
    getCalculation();


  if(!result.valid){

    alert(
      'Please enter valid dimensions.\n请输入正确尺寸。'
    );

    return;

  }


  const history =
    getHistory();


  const record = {

    id:
      Date.now(),

    shape:
      result.shape,

    Q:
      result.Q,

    singleKg:
      result.singleKg,

    totalKg:
      result.totalKg,

    time:
      new Date().toLocaleString(),

    data:
      result.data

  };


  history.unshift(
    record
  );


  if(history.length > 50){

    history.length =
      50;

  }


  saveHistory(
    history
  );


  renderHistory();


  savedMessage.style.display =
    'block';


  setTimeout(
    function(){

      savedMessage.style.display =
        'none';

    },
    1500
  );

}



function loadRecord(id){

  const history =
    getHistory();


  const item =
    history.find(
      record =>
        record.id === id
    );


  if(!item){

    return;

  }


  shape.value =
    item.shape;


  changeShape();


  quantityInput.value =
    item.Q;


  if(
    item.shape === 'plate'
  ){

    plateL.value =
      item.data.L;

    plateW.value =
      item.data.W;

    plateT.value =
      item.data.T;


    plateLu.value =
      item.data.Lu;

    plateWu.value =
      item.data.Wu;

    plateTu.value =
      item.data.Tu;

  }


  else if(
    item.shape === 'roundTube'
  ){

    tubeOD.value =
      item.data.OD;

    tubeL.value =
      item.data.L;

    tubeT.value =
      item.data.T;


    tubeODu.value =
      item.data.ODu;

    tubeLu.value =
      item.data.Lu;

    tubeTu.value =
      item.data.Tu;

  }


  calculateWeight();


  window.scrollTo({

    top:0,

    behavior:'smooth'

  });

}



function deleteRecord(id){

  let history =
    getHistory();


  history =
    history.filter(
      record =>
        record.id !== id
    );


  saveHistory(
    history
  );


  renderHistory();

}



function clearHistory(){

  const history =
    getHistory();


  if(history.length === 0){

    return;

  }


  const answer =
    confirm(
      'Clear all history?\n确定清除全部历史记录？'
    );


  if(!answer){

    return;

  }


  localStorage.removeItem(
    'metalWeightHistory'
  );


  renderHistory();

}



function renderHistory(){

  const history =
    getHistory();


  historyList.innerHTML =
    '';


  if(history.length === 0){

    historyList.innerHTML =

      '<div class="empty-history">' +
      'No saved records · 暂无历史记录' +
      '</div>';

    return;

  }


  history.forEach(
    function(item){


      const div =
        document.createElement(
          'div'
        );


      div.className =
        'history-item';



      let shapeName =
        '';

      let dimensions =
        '';

      let extra =
        '';



      if(
        item.shape === 'plate'
      ){

        shapeName =
          'Plate 板材';


        dimensions =

          item.data.L +
          ' ' +
          unitLabel[item.data.Lu] +

          ' × ' +

          item.data.W +
          ' ' +
          unitLabel[item.data.Wu] +

          ' × ' +

          item.data.T +
          ' ' +
          unitLabel[item.data.Tu];

      }


      else if(
        item.shape === 'roundTube'
      ){

        shapeName =
          'Hollow Round Tube 空心圆管';


        dimensions =

          'OD ' +

          item.data.OD +
          ' ' +
          unitLabel[item.data.ODu] +

          ' × L ' +

          item.data.L +
          ' ' +
          unitLabel[item.data.Lu] +

          ' × T ' +

          item.data.T +
          ' ' +
          unitLabel[item.data.Tu];


        if(
          item.data.innerDiameterMM
        ){

          extra =

            'Inner Diameter 内径: ' +

            item.data.innerDiameterMM
              .toFixed(3) +

            ' mm<br>';

        }

      }



      div.innerHTML = `

        <div
          class="history-main"
          onclick="loadRecord(${item.id})"
        >

          <div class="history-shape">
            ${shapeName}
          </div>

          <div class="history-dimensions">
            ${dimensions}
          </div>

          <div class="history-info">

            ${extra}

            Quantity 数量:
            ${item.Q} PCS

          </div>

          <div class="history-weight">

            Single:
            <strong>
              ${formatWeight(item.singleKg)} KG
            </strong>

            <br>

            Total:
            <strong>
              ${formatWeight(item.totalKg)} KG
            </strong>

          </div>

        </div>


        <div class="history-bottom">

          <div class="history-time">
            ${item.time}
          </div>

          <button
            class="delete-btn"
            type="button"
            onclick="
              event.stopPropagation();
              deleteRecord(${item.id})
            "
          >
            Delete 删除
          </button>

        </div>

      `;


      historyList.appendChild(
        div
      );

    }

  );

}



shape.addEventListener(
  'change',
  changeShape
);



saveBtn.addEventListener(
  'click',
  saveRecord
);


resetBtn.addEventListener(
  'click',
  resetForm
);


clearHistoryBtn.addEventListener(
  'click',
  clearHistory
);



const allInputs = [

  plateL,
  plateW,
  plateT,

  tubeOD,
  tubeL,
  tubeT,

  quantityInput

];


allInputs.forEach(
  function(element){

    element.addEventListener(
      'input',
      calculateWeight
    );

  }
);



const allSelects = [

  plateLu,
  plateWu,
  plateTu,

  tubeODu,
  tubeLu,
  tubeTu

];


allSelects.forEach(
  function(element){

    element.addEventListener(
      'change',
      calculateWeight
    );

  }
);



allInputs.forEach(
  function(element){

    element.addEventListener(
      'focus',
      function(){

        setTimeout(
          function(){

            element.select();

          },
          50
        );

      }
    );


    element.addEventListener(
      'click',
      function(){

        element.select();

      }
    );

  }
);



let deferredPrompt =
  null;


const installBox =
  document.getElementById(
    'installBox'
  );


const installBtn =
  document.getElementById(
    'installBtn'
  );


window.addEventListener(

  'beforeinstallprompt',

  function(e){

    e.preventDefault();

    deferredPrompt =
      e;

    installBox.style.display =
      'block';

  }

);


installBtn.addEventListener(

  'click',

  async function(){

    if(deferredPrompt){

      deferredPrompt.prompt();

      deferredPrompt =
        null;

    }

  }

);



if(
  'serviceWorker' in navigator
){

  navigator.serviceWorker.register(
    'sw.js'
  );

}



changeShape();

renderHistory();
</script>
<div
  id="drawerOverlay"
  class="drawer-overlay"
></div>


<div
  id="drawer"
  class="drawer"
>

  <div class="drawer-header">

    <div class="drawer-title">
      Menu 菜单
    </div>

    <button
      id="drawerClose"
      class="drawer-close"
      type="button"
    >
      ×
    </button>

  </div>


  <button
    class="drawer-item"
    data-page="calculator"
    type="button"
  >
    Calculator 计算器
  </button>


  <button
    class="drawer-item"
    data-page="history"
    type="button"
  >
    History 历史记录
  </button>


  <button
    class="drawer-item"
    data-page="settings"
    type="button"
  >
    Settings 设置
  </button>


  <button
    class="drawer-item"
    data-page="about"
    type="button"
  >
    About 关于
  </button>

</div>
</script>
  <script>

const menuBtn =
  document.getElementById('menuBtn');

const drawer =
  document.getElementById('drawer');

const drawerOverlay =
  document.getElementById('drawerOverlay');

const drawerClose =
  document.getElementById('drawerClose');


function openDrawer(){

  drawer.classList.add('open');

  drawerOverlay.classList.add('open');

}


function closeDrawer(){

  drawer.classList.remove('open');

  drawerOverlay.classList.remove('open');

}


menuBtn.addEventListener(
  'click',
  openDrawer
);


drawerClose.addEventListener(
  'click',
  closeDrawer
);


drawerOverlay.addEventListener(
  'click',
  closeDrawer
);


document
  .querySelectorAll('.drawer-item')
  .forEach(function(item){

    item.addEventListener(
      'click',
      function(){

        const page =
          item.dataset.page;


        if(page === 'calculator'){

          window.scrollTo({
            top:0,
            behavior:'smooth'
          });

        }


        else if(page === 'history'){

          document
            .querySelector('.history-card')
            ?.scrollIntoView({
              behavior:'smooth'
            });

        }


        else if(page === 'settings'){

          alert(
            'Settings coming soon.\n设置功能稍后加入。'
          );

        }


        else if(page === 'about'){

          alert(
            'Metal Weight Calculator\nSteel density: 7,850 kg/m³\n\n金属重量计算器'
          );

        }


        closeDrawer();

      }
    );

  });

</script>
