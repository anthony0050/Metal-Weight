<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">

<title>Metal Plate Weight</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.wrap{
  max-width:620px;
  margin:auto;
  padding:20px 16px 36px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

h1{
  font-size:24px;
  margin:0;
  font-weight:750;
}

.sub{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 3px 14px #0000000b;
}

label{
  display:block;
  font-size:14px;
  color:#6b7280;
  margin:0 0 7px;
}

.row{
  display:grid;
  grid-template-columns:minmax(110px,0.75fr) minmax(165px,1.25fr);
  gap:10px;
  margin-bottom:14px;
}

input,
select,
button{
  width:100%;
  height:50px;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:0 13px;
  font-size:16px;
  background:white;
}

input{
  font-size:18px;
  font-weight:500;
}

select{
  font-size:15px;
}

input:focus,
select:focus{
  outline:2px solid #9ca3af;
  outline-offset:1px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

button{
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#111827;
  color:white;
  border-color:#111827;
}

.danger{
  background:#fff;
}

.result{
  background:#111827;
  color:white;
  border-radius:18px;
  padding:24px 18px;
  margin-top:14px;
  text-align:center;
}

.result-title{
  font-size:13px;
  color:#9ca3af;
  margin-bottom:6px;
}

.result .num{
  font-size:42px;
  font-weight:800;
  line-height:1.1;
  word-break:break-word;
}

.result .unit{
  font-size:15px;
  color:#d1d5db;
  margin-top:7px;
}

.note{
  font-size:12px;
  color:#6b7280;
  line-height:1.6;
  text-align:center;
  margin-top:15px;
}

.install{
  display:none;
  margin-bottom:12px;
}

.install button{
  background:#fff;
}

/* Small phones */
@media(max-width:420px){

  .wrap{
    padding:16px 12px 28px;
  }

  .card{
    padding:15px;
  }

  .row{
    grid-template-columns:minmax(95px,0.7fr) minmax(155px,1.3fr);
    gap:8px;
  }

  input,
  select,
  button{
    height:48px;
  }

  select{
    font-size:14px;
    padding-left:10px;
    padding-right:8px;
  }

  .result .num{
    font-size:36px;
  }

  .actions{
    gap:8px;
  }

  button{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div>
      <h1>Metal Plate Weight</h1>
      <div class="sub">
        Steel Plate Weight Calculator · 铁板重量计算器
      </div>
    </div>
  </div>

  <div class="card install" id="installBox">
    <button id="installBtn">
      + Install App 安装到手机
    </button>
  </div>

  <div class="card">

    <label>Length 长度</label>

    <div class="row">

      <input
        id="L"
        type="number"
        inputmode="decimal"
        value="1"
        step="any"
        maxlength="7"
      >

      <select id="Lu">
        <option value="m">Meter (m)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="mm">Millimeter (mm)</option>
        <option value="ft">Feet (ft)</option>
        <option value="in">Inch (in)</option>
      </select>

    </div>


    <label>Width 宽度</label>

    <div class="row">

      <input
        id="W"
        type="number"
        inputmode="decimal"
        value="1"
        step="any"
        maxlength="7"
      >

      <select id="Wu">
        <option value="m">Meter (m)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="mm">Millimeter (mm)</option>
        <option value="ft">Feet (ft)</option>
        <option value="in">Inch (in)</option>
      </select>

    </div>


    <label>Thickness 厚度</label>

    <div class="row">

      <input
        id="T"
        type="number"
        inputmode="decimal"
        value="1"
        step="any"
        maxlength="7"
      >

      <select id="Tu">
        <option value="mm" selected>Millimeter (mm)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="m">Meter (m)</option>
        <option value="ft">Feet (ft)</option>
        <option value="in">Inch (in)</option>
      </select>

    </div>


    <div class="actions">

      <button
        class="primary"
        id="calcBtn"
        type="button"
      >
        Calculate 计算
      </button>

      <button
        class="danger"
        id="resetBtn"
        type="button"
      >
        Reset 清除
      </button>

    </div>

  </div>


  <div class="result">

    <div class="result-title">
      Weight 重量
    </div>

    <div class="num" id="kg">
      7.850
    </div>

    <div class="unit">
      KG
    </div>

  </div>


  <div class="note">

    Steel density: 7,850 kg/m³
    <br>

    钢材密度：7,850 kg/m³
    <br>

    Calculated as solid steel volume.
    <br>

    按实心钢材体积计算。

  </div>

</div>


<script>

const factor = {
  m: 1,
  cm: 0.01,
  mm: 0.001,
  ft: 0.3048,
  in: 0.0254
};


const lengthInput =
  document.getElementById('L');

const widthInput =
  document.getElementById('W');

const thicknessInput =
  document.getElementById('T');


const lengthUnit =
  document.getElementById('Lu');

const widthUnit =
  document.getElementById('Wu');

const thicknessUnit =
  document.getElementById('Tu');


const resultBox =
  document.getElementById('kg');

const calcBtn =
  document.getElementById('calcBtn');

const resetBtn =
  document.getElementById('resetBtn');



function calculateWeight(){

  const L =
    parseFloat(lengthInput.value) || 0;

  const W =
    parseFloat(widthInput.value) || 0;

  const T =
    parseFloat(thicknessInput.value) || 0;


  const lengthMetres =
    L * factor[lengthUnit.value];

  const widthMetres =
    W * factor[widthUnit.value];

  const thicknessMetres =
    T * factor[thicknessUnit.value];


  const volume =
    lengthMetres *
    widthMetres *
    thicknessMetres;


  const kg =
    volume * 7850;


  if(kg === 0){

    resultBox.textContent = '0.000';

    return;

  }


  if(kg < 1){

    resultBox.textContent =
      kg.toLocaleString(
        'en-US',
        {
          minimumFractionDigits:3,
          maximumFractionDigits:6
        }
      );

  }else{

    resultBox.textContent =
      kg.toLocaleString(
        'en-US',
        {
          minimumFractionDigits:3,
          maximumFractionDigits:3
        }
      );

  }

}



function resetForm(){

  lengthInput.value = 1;
  widthInput.value = 1;
  thicknessInput.value = 1;

  lengthUnit.value = 'm';
  widthUnit.value = 'm';
  thicknessUnit.value = 'mm';

  calculateWeight();

}



calcBtn.addEventListener(
  'click',
  calculateWeight
);


resetBtn.addEventListener(
  'click',
  resetForm
);



[
  lengthInput,
  widthInput,
  thicknessInput
]
.forEach(function(element){

  element.addEventListener(
    'input',
    calculateWeight
  );

});



[
  lengthUnit,
  widthUnit,
  thicknessUnit
]
.forEach(function(element){

  element.addEventListener(
    'change',
    calculateWeight
  );

});



let deferredPrompt = null;

const installBox =
  document.getElementById('installBox');

const installBtn =
  document.getElementById('installBtn');


window.addEventListener(
  'beforeinstallprompt',
  function(e){

    e.preventDefault();

    deferredPrompt = e;

    installBox.style.display =
      'block';

  }
);


installBtn.addEventListener(
  'click',
  async function(){

    if(deferredPrompt){

      deferredPrompt.prompt();

      deferredPrompt = null;

    }

  }
);



if('serviceWorker' in navigator){

  navigator.serviceWorker.register(
    'sw.js'
  );

}


calculateWeight();

</script>

</body>
</html>
