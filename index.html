<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Metal Plate Weight</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
.wrap{max-width:620px;margin:auto;padding:20px 16px 36px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:23px;margin:0}.sub{color:#6b7280;font-size:13px;margin-top:4px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0000000b}
label{display:block;font-size:13px;color:#6b7280;margin:0 0 7px}.row{display:grid;grid-template-columns:1fr 100px;gap:10px;margin-bottom:13px}
input,select,button{width:100%;height:48px;border:1px solid #d1d5db;border-radius:12px;padding:0 13px;font-size:16px;background:white}
input:focus,select:focus{outline:2px solid #9ca3af;outline-offset:1px}
.result{background:#111827;color:white;border-radius:18px;padding:22px;margin-top:14px;text-align:center}
.result .num{font-size:40px;font-weight:750;line-height:1.1}.result .unit{font-size:15px;color:#d1d5db;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{cursor:pointer;font-weight:650}
.primary{background:#111827;color:white;border-color:#111827}.danger{background:#fff}
.note{font-size:12px;color:#6b7280;line-height:1.5;text-align:center;margin-top:15px}
.install{display:none;margin-bottom:12px}.install button{background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Metal Plate Weight</h1><div class="sub">铁板重量计算器</div></div>
  </div>
  <div class="card install" id="installBox"><button id="installBtn">＋ 安装到手机主屏幕</button></div>
  <div class="card">
    <label>长度 Length</label>
    <div class="row"><input id="L" type="number" inputmode="decimal" value="1" step="any"><select id="Lu"><option value="m">Meter (m)</option><option value="mm">Millimeter (mm)</option><option value="ft">Feet (ft)</option><option value="in">Inch (in)</option></select></div>
    <label>宽度 Width</label>
    <div class="row"><input id="W" type="number" inputmode="decimal" value="1" step="any"><select id="Wu"><option value="m">Meter (m)</option><option value="mm">Millimeter (mm)</option><option value="ft">Feet (ft)</option><option value="in">Inch (in)</option></select></div>
    <label>厚度 Thickness</label>
    <div class="row"><input id="T" type="number" inputmode="decimal" value="1" step="any"><select id="Tu"><option value="mm" selected>Millimeter (mm)</option><option value="m">Meter (m)</option><option value="ft">Feet (ft)</option><option value="in">Inch (in)</option></select></div>
    <div class="actions"><button class="primary" onclick="calc()">计算 Calculate</button><button class="danger" onclick="resetForm()">清除 Reset</button></div>
  </div>
  <div class="result"><div class="num" id="kg">0.007850</div><div class="unit">KG</div></div>
  <div class="note">钢材密度：7,850 kg/m³<br>结果按实心钢材体积计算。</div>
</div>
<script>
const f={m:1,mm:.001,ft:.3048,in:.0254};
function calc(){
  const L=+document.getElementById('L').value||0,W=+document.getElementById('W').value||0,T=+document.getElementById('T').value||0;
  const kg=L*f[Lu.value]*W*f[Wu.value]*T*f[Tu.value]*7850;
  document.getElementById('kg').textContent=kg.toLocaleString('en-US',{minimumFractionDigits:6,maximumFractionDigits:3});
}
function resetForm(){L.value=1;W.value=1;T.value=1;Lu.value='m';Wu.value='m';Tu.value='mm';calc()}
['L','W','T','Lu','Wu','Tu'].forEach(id=>document.getElementById(id).addEventListener('input',calc));
let deferred;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;installBox.style.display='block'});
installBtn?.addEventListener('click',async()=>{if(deferred){deferred.prompt();deferred=null}});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
calc();
</script>
</body></html>
