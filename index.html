<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">

<title>Metal Plate Weight</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.wrap{
  max-width:620px;
  margin:auto;
  padding:20px 16px 36px;
}

.top{
  margin-bottom:18px;
}

h1{
  font-size:24px;
  margin:0;
  font-weight:750;
}

.sub{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 3px 14px #0000000b;
}

label{
  display:block;
  font-size:14px;
  color:#6b7280;
  margin:0 0 7px;
}

.row,
.quantity-row{
  display:grid;
  grid-template-columns:minmax(110px,0.75fr) minmax(165px,1.25fr);
  gap:10px;
  margin-bottom:14px;
}

input,
select,
button{
  width:100%;
  height:50px;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:0 13px;
  font-size:16px;
  background:white;
}

input{
  font-size:18px;
  font-weight:500;
}

select{
  font-size:15px;
}

input:focus,
select:focus{
  outline:2px solid #9ca3af;
  outline-offset:1px;
}

.qty-label{
  display:flex;
  align-items:center;
  padding:0 13px;
  height:50px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#f9fafb;
  color:#6b7280;
  font-size:15px;
}

.result{
  background:#111827;
  color:white;
  border-radius:18px;
  padding:22px 18px;
  margin-top:14px;
}

.result-item{
  text-align:center;
}

.result-divider{
  height:1px;
  background:#374151;
  margin:18px 0;
}

.result-title{
  font-size:13px;
  color:#9ca3af;
  margin-bottom:6px;
}

.result .num{
  font-size:38px;
  font-weight:800;
  line-height:1.1;
  word-break:break-word;
}

.total .num{
  font-size:44px;
}

.result .unit{
  font-size:15px;
  color:#d1d5db;
  margin-top:7px;
}

.action-area{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

button{
  cursor:pointer;
  font-weight:700;
}

.save-btn{
  background:#111827;
  color:white;
  border-color:#111827;
}

.reset-btn{
  background:white;
  color:#111827;
}

.history-card{
  margin-top:14px;
}

.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.history-title{
  font-size:18px;
  font-weight:750;
}

.clear-history{
  width:auto;
  height:38px;
  padding:0 12px;
  font-size:13px;
  color:#991b1b;
  background:#fff;
}

.empty-history{
  color:#9ca3af;
  text-align:center;
  font-size:14px;
  padding:18px 5px;
}

.history-item{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:13px;
  margin-top:10px;
  background:#f9fafb;
}

.history-main{
  cursor:pointer;
}

.history-dimensions{
  font-size:15px;
  font-weight:700;
  line-height:1.5;
}

.history-info{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
  line-height:1.5;
}

.history-weight{
  margin-top:8px;
  font-size:14px;
}

.history-weight strong{
  color:#111827;
}

.history-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.history-time{
  font-size:11px;
  color:#9ca3af;
}

.delete-btn{
  width:auto;
  height:34px;
  padding:0 11px;
  font-size:12px;
  background:#fff;
  color:#991b1b;
}

.saved-message{
  display:none;
  text-align:center;
  color:#047857;
  font-size:13px;
  font-weight:600;
  margin-top:9px;
}

.note{
  font-size:12px;
  color:#6b7280;
  line-height:1.6;
  text-align:center;
  margin-top:15px;
}

.install{
  display:none;
  margin-bottom:12px;
}

.install button{
  background:#fff;
}

@media(max-width:420px){

  .wrap{
    padding:16px 12px 28px;
  }

  .card{
    padding:15px;
  }

  .row,
  .quantity-row{
    grid-template-columns:minmax(95px,0.7fr) minmax(155px,1.3fr);
    gap:8px;
  }

  input,
  select,
  button,
  .qty-label{
    height:48px;
  }

  select{
    font-size:14px;
    padding-left:10px;
    padding-right:8px;
  }

  .result .num{
    font-size:34px;
  }

  .total .num{
    font-size:40px;
  }

  .action-area{
    gap:8px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <h1>Metal Plate Weight</h1>

    <div class="sub">
      Steel Plate Weight Calculator · 铁板重量计算器
    </div>
  </div>


  <div class="card install" id="installBox">
    <button id="installBtn">
      + Install App 安装到手机
    </button>
  </div>


  <div class="card">

    <label>Length 长度</label>

    <div class="row">

      <input
        id="L"
        type="number"
        inputmode="decimal"
        value="1"
        step="any"
      >

      <select id="Lu">
        <option value="m">Meter (m)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="mm">Millimeter (mm)</option>
        <option value="ft">Feet (ft)</option>
        <option value="in">Inch (in)</option>
      </select>

    </div>


    <label>Width 宽度</label>

    <div class="row">

      <input
        id="W"
        type="number"
        inputmode="decimal"
        value="1"
        step="any"
      >

      <select id="Wu">
        <option value="m">Meter (m)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="mm">Millimeter (mm)</option>
        <option value="ft">Feet (ft)</option>
        <option value="in">Inch (in)</option>
      </select>

    </div>


    <label>Thickness 厚度</label>

    <div class="row">

      <input
        id="T"
        type="number"
        inputmode="decimal"
        value="1"
        step="any"
      >

      <select id="Tu">

        <option value="mm" selected>
          Millimeter (mm)
        </option>

        <option value="cm">
          Centimeter (cm)
        </option>

        <option value="m">
          Meter (m)
        </option>

        <option value="ft">
          Feet (ft)
        </option>

        <option value="in">
          Inch (in)
        </option>

      </select>

    </div>


    <label>Quantity 数量</label>

    <div class="quantity-row">

      <input
        id="Q"
        type="number"
        inputmode="numeric"
        value="1"
        min="1"
        step="1"
      >

      <div class="qty-label">
        Pieces (PCS) · 件
      </div>

    </div>

  </div>


  <div class="result">

    <div class="result-item">

      <div class="result-title">
        Single Weight 单件重量
      </div>

      <div class="num" id="singleKg">
        7.850
      </div>

      <div class="unit">
        KG
      </div>

    </div>


    <div class="result-divider"></div>


    <div class="result-item total">

      <div class="result-title">
        Total Weight 总重量
      </div>

      <div class="num" id="totalKg">
        7.850
      </div>

      <div class="unit">
        KG
      </div>

    </div>

  </div>


  <div class="action-area">

    <button
      class="save-btn"
      id="saveBtn"
      type="button"
    >
      Save Record 保存记录
    </button>

    <button
      class="reset-btn"
      id="resetBtn"
      type="button"
    >
      Reset 清除
    </button>

  </div>

  <div
    class="saved-message"
    id="savedMessage"
  >
    ✓ Record saved 已保存
  </div>


  <div class="card history-card">

    <div class="history-header">

      <div class="history-title">
        History 历史记录
      </div>

      <button
        class="clear-history"
        id="clearHistoryBtn"
        type="button"
      >
        Clear All 全部清除
      </button>

    </div>

    <div id="historyList"></div>

  </div>


  <div class="note">

    Steel density: 7,850 kg/m³
    <br>

    钢材密度：7,850 kg/m³
    <br>

    Calculated as solid steel volume.
    <br>

    按实心钢材体积计算。

  </div>

</div>


<script>

const factor = {
  m: 1,
  cm: 0.01,
  mm: 0.001,
  ft: 0.3048,
  in: 0.0254
};


const unitLabel = {
  m: 'm',
  cm: 'cm',
  mm: 'mm',
  ft: 'ft',
  in: 'in'
};


const lengthInput =
  document.getElementById('L');

const widthInput =
  document.getElementById('W');

const thicknessInput =
  document.getElementById('T');

const quantityInput =
  document.getElementById('Q');


const lengthUnit =
  document.getElementById('Lu');

const widthUnit =
  document.getElementById('Wu');

const thicknessUnit =
  document.getElementById('Tu');


const singleBox =
  document.getElementById('singleKg');

const totalBox =
  document.getElementById('totalKg');


const saveBtn =
  document.getElementById('saveBtn');

const resetBtn =
  document.getElementById('resetBtn');

const historyList =
  document.getElementById('historyList');

const clearHistoryBtn =
  document.getElementById('clearHistoryBtn');

const savedMessage =
  document.getElementById('savedMessage');


function formatWeight(kg){

  if(kg === 0){
    return '0.000';
  }

  if(kg < 1){

    return kg.toLocaleString(
      'en-US',
      {
        minimumFractionDigits:3,
        maximumFractionDigits:6
      }
    );

  }

  return kg.toLocaleString(
    'en-US',
    {
      minimumFractionDigits:3,
      maximumFractionDigits:3
    }
  );

}


function getCalculation(){

  const L =
    parseFloat(lengthInput.value) || 0;

  const W =
    parseFloat(widthInput.value) || 0;

  const T =
    parseFloat(thicknessInput.value) || 0;

  let Q =
    parseInt(quantityInput.value,10) || 1;

  if(Q < 1){
    Q = 1;
  }


  const lengthMetres =
    L * factor[lengthUnit.value];

  const widthMetres =
    W * factor[widthUnit.value];

  const thicknessMetres =
    T * factor[thicknessUnit.value];


  const volume =
    lengthMetres *
    widthMetres *
    thicknessMetres;


  const singleKg =
    volume * 7850;

  const totalKg =
    singleKg * Q;


  return {
    L,
    W,
    T,
    Q,
    Lu:lengthUnit.value,
    Wu:widthUnit.value,
    Tu:thicknessUnit.value,
    singleKg,
    totalKg
  };

}


function calculateWeight(){

  const data =
    getCalculation();

  singleBox.textContent =
    formatWeight(data.singleKg);

  totalBox.textContent =
    formatWeight(data.totalKg);

}


function resetForm(){

  lengthInput.value = 1;
  widthInput.value = 1;
  thicknessInput.value = 1;
  quantityInput.value = 1;

  lengthUnit.value = 'm';
  widthUnit.value = 'm';
  thicknessUnit.value = 'mm';

  calculateWeight();

}


function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        'metalWeightHistory'
      )
    ) || [];

  }catch(e){

    return [];

  }

}


function saveHistory(history){

  localStorage.setItem(
    'metalWeightHistory',
    JSON.stringify(history)
  );

}


function saveRecord(){

  const data =
    getCalculation();


  if(
    data.L <= 0 ||
    data.W <= 0 ||
    data.T <= 0
  ){

    alert(
      'Please enter valid dimensions.\n请输入正确尺寸。'
    );

    return;

  }


  const history =
    getHistory();


  history.unshift({

    id: Date.now(),

    L: data.L,
    W: data.W,
    T: data.T,
    Q: data.Q,

    Lu: data.Lu,
    Wu: data.Wu,
    Tu: data.Tu,

    singleKg: data.singleKg,
    totalKg: data.totalKg,

    time:
      new Date().toLocaleString()

  });


  if(history.length > 50){
    history.length = 50;
  }


  saveHistory(history);

  renderHistory();


  savedMessage.style.display =
    'block';


  setTimeout(function(){

    savedMessage.style.display =
      'none';

  },1500);

}


function loadRecord(id){

  const history =
    getHistory();

  const item =
    history.find(
      record => record.id === id
    );


  if(!item){
    return;
  }


  lengthInput.value =
    item.L;

  widthInput.value =
    item.W;

  thicknessInput.value =
    item.T;

  quantityInput.value =
    item.Q;


  lengthUnit.value =
    item.Lu;

  widthUnit.value =
    item.Wu;

  thicknessUnit.value =
    item.Tu;


  calculateWeight();


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


function deleteRecord(id){

  let history =
    getHistory();


  history =
    history.filter(
      record => record.id !== id
    );


  saveHistory(history);

  renderHistory();

}


function clearHistory(){

  const history =
    getHistory();


  if(history.length === 0){
    return;
  }


  const answer =
    confirm(
      'Clear all history?\n确定清除全部历史记录？'
    );


  if(!answer){
    return;
  }


  localStorage.removeItem(
    'metalWeightHistory'
  );


  renderHistory();

}


function renderHistory(){

  const history =
    getHistory();


  historyList.innerHTML = '';


  if(history.length === 0){

    historyList.innerHTML =
      '<div class="empty-history">No saved records · 暂无历史记录</div>';

    return;

  }


  history.forEach(function(item){

    const div =
      document.createElement('div');

    div.className =
      'history-item';


    div.innerHTML = `

      <div
        class="history-main"
        onclick="loadRecord(${item.id})"
      >

        <div class="history-dimensions">

          ${item.L} ${unitLabel[item.Lu]}
          ×
          ${item.W} ${unitLabel[item.Wu]}
          ×
          ${item.T} ${unitLabel[item.Tu]}

        </div>

        <div class="history-info">

          Quantity 数量:
          ${item.Q} PCS

        </div>

        <div class="history-weight">

          Single:
          <strong>
            ${formatWeight(item.singleKg)} KG
          </strong>

          <br>

          Total:
          <strong>
            ${formatWeight(item.totalKg)} KG
          </strong>

        </div>

      </div>


      <div class="history-bottom">

        <div class="history-time">
          ${item.time}
        </div>

        <button
          class="delete-btn"
          type="button"
          onclick="event.stopPropagation();deleteRecord(${item.id})"
        >
          Delete 删除
        </button>

      </div>

    `;


    historyList.appendChild(div);

  });

}


saveBtn.addEventListener(
  'click',
  saveRecord
);


resetBtn.addEventListener(
  'click',
  resetForm
);


clearHistoryBtn.addEventListener(
  'click',
  clearHistory
);


[
  lengthInput,
  widthInput,
  thicknessInput,
  quantityInput
]
.forEach(function(element){

  element.addEventListener(
    'input',
    calculateWeight
  );

});


[
  lengthUnit,
  widthUnit,
  thicknessUnit
]
.forEach(function(element){

  element.addEventListener(
    'change',
    calculateWeight
  );

});


[
  lengthInput,
  widthInput,
  thicknessInput,
  quantityInput
]
.forEach(function(element){

  element.addEventListener(
    'focus',
    function(){

      setTimeout(function(){

        element.select();

      },50);

    }
  );


  element.addEventListener(
    'click',
    function(){

      element.select();

    }
  );

});


let deferredPrompt = null;


const installBox =
  document.getElementById('installBox');

const installBtn =
  document.getElementById('installBtn');


window.addEventListener(
  'beforeinstallprompt',
  function(e){

    e.preventDefault();

    deferredPrompt = e;

    installBox.style.display =
      'block';

  }
);


installBtn.addEventListener(
  'click',
  async function(){

    if(deferredPrompt){

      deferredPrompt.prompt();

      deferredPrompt = null;

    }

  }
);


if('serviceWorker' in navigator){

  navigator.serviceWorker.register(
    'sw.js'
  );

}


calculateWeight();

renderHistory();

</script>

</body>
</html>
